input {
  file {
    path => "/usr/share/logstash/input-data/stanice_morava.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/tmp/stanice_morava.done"
  }
}

filter {
  csv {
    separator => ","
    columns => ["station_id", "station_name", "region", "district", "city", "elevation", "latitude", "longitude", "station_type", "owner"]
    skip_header => "true"
  }

  mutate {
    convert => {
      "elevation" => "integer"
      "latitude" => "float"
      "longitude" => "float"
    }
  }

  mutate {
    add_field => {
      "[location][lat]" => "%{latitude}"
      "[location][lon]" => "%{longitude}"
    }
  }

  mutate {
    convert => {
      "[location][lat]" => "float"
      "[location][lon]" => "float"
    }
    remove_field => ["host", "message", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "stanice"
    document_id => "%{station_id}"
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
  }
}
