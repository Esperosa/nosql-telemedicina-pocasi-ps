input {
  file {
    path => "/usr/share/logstash/input-data/meteo_mereni_2024.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/tmp/meteo_2024.done"
  }
}

filter {
  csv {
    separator => ","
    columns => ["measurement_id", "station_id", "timestamp", "temperature", "relative_humidity", "pressure", "wind_speed", "wind_direction", "precipitation", "weather_condition"]
    skip_header => "true"
  }

  mutate {
    convert => {
      "temperature" => "float"
      "relative_humidity" => "float"
      "pressure" => "float"
      "wind_speed" => "float"
      "wind_direction" => "integer"
      "precipitation" => "float"
    }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    remove_field => ["host", "message", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "meteo_mereni-2024"
    document_id => "%{measurement_id}"
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
  }
}
