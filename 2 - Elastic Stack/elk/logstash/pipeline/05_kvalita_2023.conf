input {
  file {
    path => "/usr/share/logstash/input-data/kvalita_ovzdusi_2023.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/tmp/kvalita_2023.done"
  }
}

filter {
  csv {
    separator => ","
    columns => ["measurement_id", "station_id", "timestamp", "pm10", "pm2_5", "no2", "so2", "o3", "aqi_index", "smog_warning"]
    skip_header => "true"
  }

  mutate {
    convert => {
      "pm10" => "float"
      "pm2_5" => "float"
      "no2" => "float"
      "so2" => "float"
      "o3" => "float"
      "aqi_index" => "integer"
    }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    remove_field => ["host", "message", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "kvalita_ovzdusi-2023"
    document_id => "%{measurement_id}"
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
  }
}
